<title>Offerte</title><style>
*{box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--bd:#262d38;--tx:#e6edf3;--mu:#8b949e;--ac:#3b82f6}
@media(prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--bd:#d8dee4;--tx:#1f2328;--mu:#636c76}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:100%;max-width:340px;text-align:center}
.box h1{font-size:19px;margin:0 0 6px}
.box p{color:var(--mu);font-size:13px;margin:0 0 18px}
.box input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:11px 13px;font-size:16px;text-align:center;letter-spacing:3px}
.box button{width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;border-radius:9px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.box button:disabled{opacity:.6;cursor:default}
.err{color:#f85149;font-size:13px;margin-top:10px;min-height:18px}
</style></head><body>

</div></div>

document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;e.textContent='';b.textContent='Decifro...';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct));
    const {stile,corpo,core,brain,cvBase,apiKey}=JSON.parse(new TextDecoder().decode(pt));
    document.head.insertAdjacentHTML('beforeend','<style>'+stile+'<\/style>');
    // Il CV di partenza e il motore vivono solo in memoria, dopo la password.
    window.CV_BASE=cvBase;
    if(apiKey)window.DEEPSEEK_KEY=apiKey;
    // Prima il motore del punteggio, poi il cervello che lo usa: l'ordine conta.
    for(const src of [core,brain]){if(src){const t=document.createElement('script');t.textContent=src;document.head.appendChild(t)}}
    document.body.innerHTML=corpo;
    // Gli script della pagina non si eseguono da innerHTML: vanno rieseguiti.
    document.body.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n)});
  }catch(err){
    e.textContent='Password sbagliata.';b.disabled=false;b.textContent='Apri';
  }
